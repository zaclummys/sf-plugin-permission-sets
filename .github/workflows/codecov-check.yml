name: codecov-check

on:
    push:
        branches: [ci/codecov-offline-check]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm

            - run: npm ci
            - run: npm test
              env:
                  NODE_V8_COVERAGE: coverage-dumps

            - id: prune
              continue-on-error: true
              run: node scripts/prune-coverage.js

            - uses: actions/upload-artifact@v4
              if: steps.prune.outcome == 'success'
              with:
                  name: coverage-dumps-offline
                  path: coverage-dumps
                  retention-days: 1
                  if-no-files-found: error

    coverage:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm

            - run: npm ci
            - run: npm run compile
            - uses: actions/download-artifact@v4
              with:
                  pattern: coverage-dumps-*
                  merge-multiple: true
                  path: coverage-dumps

            - run: npx c8 report
            - uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info
                  disable_search: true
                  fail_ci_if_error: true
