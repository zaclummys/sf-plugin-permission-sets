name: ci

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:
    workflow_call:
        secrets:
            TESTKIT_AUTH_URL:
                description: >-
                    Auth URL for the Dev Hub that test-org creates its scratch org from.
                    Give it a hub nobody uses by hand: a scratch org allocation is daily
                    and per hub, so sharing one means a busy afternoon can block a release.
                required: false

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  # Pinned to 24: Node 26 removed Buffer.SlowBuffer, which the current
                  # lint toolchain still depends on transitively.
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run build

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm test
              env:
                  NODE_V8_COVERAGE: coverage-dumps
            - id: prune
              continue-on-error: true
              run: node scripts/prune-coverage.js
            - uses: actions/upload-artifact@v4
              continue-on-error: true
              if: steps.prune.outcome == 'success'
              with:
                  name: coverage-dumps-offline
                  path: coverage-dumps
                  retention-days: 1
                  if-no-files-found: error

    test-org:
        if: github.event_name != 'push'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm install --global @salesforce/cli
            - run: npm run test:org
              env:
                  TESTKIT_AUTH_URL: ${{ secrets.TESTKIT_AUTH_URL }}
                  NODE_V8_COVERAGE: coverage-dumps
            - id: prune
              continue-on-error: true
              run: node scripts/prune-coverage.js
            - uses: actions/upload-artifact@v4
              continue-on-error: true
              if: steps.prune.outcome == 'success'
              with:
                  name: coverage-dumps-org
                  path: coverage-dumps
                  retention-days: 1
                  if-no-files-found: error
