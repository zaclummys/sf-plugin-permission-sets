name: ci

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:
    workflow_call:
        secrets:
            TESTKIT_AUTH_URL:
                description: Auth URL for the testkit orgs.
                required: false
            CODECOV_TOKEN:
                description: Upload token for the coverage job.
                required: false

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  # Pinned to 24: Node 26 removed Buffer.SlowBuffer, which the current
                  # lint toolchain still depends on transitively.
                  node-version: "24"
                  cache: npm
            - run: npm ci
            - run: npm run build

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci

            - run: npm install --global @salesforce/cli
              if: github.event_name != 'push'

            - run: npm run test
              env:
                  NODE_V8_COVERAGE: coverage-dumps

            - run: npm run test:org
              if: github.event_name != 'push'
              env:
                  TESTKIT_AUTH_URL: ${{ secrets.TESTKIT_AUTH_URL }}
                  NODE_V8_COVERAGE: coverage-dumps

            - run: node scripts/prune-coverage.js

            - run: npx c8 report

            - uses: codecov/codecov-action@v5
              if: github.event_name != 'push'
              continue-on-error: ${{ github.event_name == 'release' }}
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info
                  disable_search: true
                  fail_ci_if_error: true
