name: ci

# Runs on pushes to main and on PRs and manual dispatch, and is callable by the
# publish workflow as its release gate (workflow_call), so build + test are defined
# once here. Three parallel jobs: build typechecks and lints, test runs the NUTs that
# need no org, and test-org runs the ones that create a scratch org. Only the last
# needs a secret, which is what lets a fork's pull request still be tested.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
    workflow_call:
        # Reusable workflows do not inherit the caller's secrets, so the release gate
        # (publish.yml) must pass this in. Optional: on a trigger without it, such as a
        # fork's pull request, only the job that needs an org fails.
        secrets:
            TESTKIT_AUTH_URL:
                description: >-
                    Auth URL for the Dev Hub that test-org creates its scratch org from.
                    Give it a hub nobody uses by hand: a scratch org allocation is daily
                    and per hub, so sharing one means a busy afternoon can block a release.
                required: false

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  # Pinned to 24: Node 26 removed Buffer.SlowBuffer, which the current
                  # lint toolchain still depends on transitively.
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run build

    # Drives the plugin's own bin/run.js, so it needs neither the sf CLI nor an org and
    # runs on a fork's pull request, where no secret is available.
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm test
              env:
                  NODE_V8_COVERAGE: .v8-coverage
            - id: prune
              continue-on-error: true
              run: node scripts/prune-coverage.js
            - uses: actions/upload-artifact@v4
              if: steps.prune.outcome == 'success'
              with:
                  name: v8-coverage-offline
                  path: .v8-coverage
                  retention-days: 1

    # Creates a scratch org of its own, so unlike the job above it needs a Dev Hub and the
    # sf CLI that the setup shells out to. Scratch org creation is the flaky part of any
    # plugin's CI, which is why the official nut.yml retries three times.
    #
    # Skipped on a push, because an allocation is daily and per hub: a run of commits
    # straight to main would spend it before the release that needs it. A pull request, a
    # manual dispatch, and the release gate still get it.
    test-org:
        if: github.event_name != 'push'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm install --global @salesforce/cli
            - run: npm run test:org
              env:
                  TESTKIT_AUTH_URL: ${{ secrets.TESTKIT_AUTH_URL }}
                  NODE_V8_COVERAGE: .v8-coverage
            - id: prune
              continue-on-error: true
              run: node scripts/prune-coverage.js
            - uses: actions/upload-artifact@v4
              if: steps.prune.outcome == 'success'
              with:
                  name: v8-coverage-org
                  path: .v8-coverage
                  retention-days: 1
