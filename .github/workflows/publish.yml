name: publish

# Release only. A push to main used to publish a 0.0.0-dev.<run> snapshot, which meant
# every commit ran the release gate below and spent a scratch org from a daily, per-hub
# allocation on a version nobody installed. Pushes now stop at ci.yml, which runs the
# jobs that need no org.
on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    # Gate: build and test must pass before anything is published, including the org
    # specs, which is the one place a scratch org is worth a slot.
    ci:
        uses: ./.github/workflows/ci.yml
        # Reusable workflows do not inherit secrets; pass the one the org job needs.
        secrets:
            TESTKIT_AUTH_URL: ${{ secrets.TESTKIT_AUTH_URL }}

    publish:
        needs: ci
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        outputs:
            version: ${{ steps.ver.outputs.version }}

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'

            - name: Determine version
              id: ver
              run: |
                  # The git tag is the single source of truth for the version.
                  VERSION="${{ github.event.release.tag_name }}"
                  VERSION="${VERSION#v}"

                  echo "Resolved version $VERSION"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Update
              run: npm install -g npm@latest

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Update Version
              run: npm pkg set version="${{ steps.ver.outputs.version }}"

            - name: Publish
              run: npm publish --provenance --access public --tag latest

    smoke-test:
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Install Salesforce CLI
              run: npm install -g @salesforce/cli

            - name: Install Plugin
              env:
                  VERSION: ${{ needs.publish.outputs.version }}
              run: |
                  PKG="sf-plugin-permission-sets@$VERSION"

                  echo "Smoke-testing $PKG"

                  # Wait for the just-published version to be installable (registry propagation).
                  for i in 1 2 3 4 5 6; do
                    if npm view "$PKG" version >/dev/null 2>&1; then echo "available on registry"; break; fi
                    echo "waiting for npm propagation ($i)"; sleep 10
                  done

                  # Auto-answer the unsigned-plugin prompt with a single y (no broken-pipe noise from yes).
                  echo y | sf plugins install "$PKG"

            - name: Dry-run Plugin
              run: sf help ps

    # The one number that describes a published version, merged from the dumps the gate
    # already collected. It holds nothing back: publish depends on ci rather than on this,
    # so a failed upload turns the run red and the version still ships.
    coverage:
        needs: ci
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run compile
            - uses: actions/download-artifact@v4
              with:
                  pattern: coverage-dumps-*
                  merge-multiple: true
                  path: coverage-dumps
            - run: npx c8 report
            - uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info
                  disable_search: true
                  fail_ci_if_error: true
