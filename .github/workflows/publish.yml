name: publish

on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    ci:
        uses: ./.github/workflows/ci.yml
        secrets:
            TESTKIT_AUTH_URL: ${{ secrets.TESTKIT_AUTH_URL }}

    publish:
        needs: ci
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        outputs:
            version: ${{ steps.ver.outputs.version }}

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'

            - name: Determine version
              id: ver
              run: |
                  VERSION="${{ github.event.release.tag_name }}"
                  VERSION="${VERSION#v}"

                  echo "Resolved version $VERSION"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Update
              run: npm install -g npm@latest

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Update Version
              run: npm pkg set version="${{ steps.ver.outputs.version }}"

            - name: Publish
              run: npm publish --provenance --access public --tag latest

    smoke-test:
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Install Salesforce CLI
              run: npm install -g @salesforce/cli

            - name: Install Plugin
              env:
                  VERSION: ${{ needs.publish.outputs.version }}
              run: |
                  PKG="sf-plugin-permission-sets@$VERSION"

                  echo "Smoke-testing $PKG"

                  for i in 1 2 3 4 5 6; do
                    if npm view "$PKG" version >/dev/null 2>&1; then echo "available on registry"; break; fi
                    echo "waiting for npm propagation ($i)"; sleep 10
                  done

                  # A single y, not yes, which floods the closed pipe with broken-pipe noise.
                  echo y | sf plugins install "$PKG"

            - name: Dry-run Plugin
              run: sf help ps

    coverage:
        needs: ci
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run compile
            - uses: actions/download-artifact@v4
              with:
                  pattern: coverage-dumps-*
                  merge-multiple: true
                  path: coverage-dumps
            - run: npx c8 report
            - uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info
                  disable_search: true
                  fail_ci_if_error: true
